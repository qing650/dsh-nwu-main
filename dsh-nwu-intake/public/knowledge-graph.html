    .hint{position:fixed;z-index:4;left:50%;bottom:30px;transform:translateX(-50%);max-width:min(510px,calc(100vw - 410px));padding:9px 13px;border:1px solid rgba(181,225,189,.12);border-radius:999px;background:rgba(10,29,19,.68);color:#bdcfbf;font-size:12px;line-height:1.35;text-align:center;backdrop-filter:blur(15px);transition:opacity .3s ease}.hint strong{color:#e9f3eb;font-weight:600}.hint.fade{opacity:0}
    .controls{position:fixed;z-index:7;right:22px;bottom:22px;display:flex;flex-direction:row;gap:7px;pointer-events:auto}.control{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(197,227,203,.16);border-radius:13px;background:rgba(14,35,24,.94);box-shadow:0 12px 28px rgba(0,0,0,.17);color:#d3e7d7;font:500 20px/1 "Noto Sans SC",sans-serif;cursor:pointer;transition:transform .14s ease,background .14s ease}.control:hover{background:#244a34;transform:translateY(-1px)}.control:active{transform:scale(.96)}.control.reset{font-size:16px}.control svg{width:18px;height:18px}

    .inspector{width:min(460px,calc(100vw - 390px));padding:20px}.inspector h2{max-width:380px;font-size:22px}.node-summary:empty{display:none}.note-content{margin-top:16px;padding:14px 2px 4px;border-top:1px solid rgba(190,221,196,.13);color:#cbd9ce;font-size:13px;line-height:1.8}.note-content h2,.note-content h3,.note-content h4{margin:19px 0 8px;color:#edf6ee;font-family:"Noto Serif SC","Songti SC",serif;line-height:1.45}.note-content h2{font-size:17px}.note-content h3{font-size:15px;color:#dcebdd}.note-content h4{font-size:13px}.note-content p{margin:0 0 10px}.note-content ul,.note-content ol{margin:0 0 12px;padding-left:20px}.note-content li{margin:3px 0}.note-content blockquote{margin:10px 0;padding:8px 11px;border-left:3px solid #568b63;background:rgba(92,143,102,.1);color:#b9cdbd}.note-content code{padding:2px 5px;border:1px solid rgba(185,217,191,.12);border-radius:5px;background:rgba(0,0,0,.2);color:#e5efe7;font:11px/1.4 Consolas,monospace}.wiki-link{display:inline;border:0;border-bottom:1px solid rgba(121,192,137,.42);padding:0;background:transparent;color:#8fd29d;cursor:pointer}.wiki-link:hover{color:#c6f0ce;border-bottom-color:#c6f0ce}.wiki-link.missing{color:#a6b5a9;border-bottom-style:dashed;cursor:default}.note-table-wrap{overflow:auto;margin:10px 0 14px;border:1px solid rgba(190,221,196,.12);border-radius:9px}.note-table{width:100%;border-collapse:collapse;font-size:11px}.note-table th,.note-table td{padding:7px 9px;border-right:1px solid rgba(190,221,196,.09);border-bottom:1px solid rgba(190,221,196,.09);text-align:left;vertical-align:top}.note-table th{background:rgba(104,154,114,.12);color:#e2eee4}.note-empty{padding:12px 0;color:#8da393}.note-skeleton{display:grid;gap:10px;padding:4px 0 12px}.note-skeleton i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(143,177,151,.09),rgba(172,207,179,.2),rgba(143,177,151,.09));background-size:220% 100%;animation:skeleton 1.4s ease-in-out infinite}.note-skeleton i:nth-child(1){width:92%}.note-skeleton i:nth-child(2){width:78%}.note-skeleton i:nth-child(3){width:86%}.note-skeleton i:nth-child(4){width:58%}@keyframes skeleton{to{background-position:-220% 0}}.note-limit{margin-top:13px;padding-top:10px;border-top:1px solid rgba(190,221,196,.1);color:#829b89;font-size:11px}.relations{margin-bottom:3px}.loading{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:10px;min-width:224px;padding:14px 16px;border:1px solid rgba(194,227,200,.15);border-radius:14px;background:rgba(11,31,20,.94);box-shadow:0 24px 68px rgba(0,0,0,.3);color:#d3e5d6;font-size:12px}.loading-bars{display:grid;grid-template-columns:1.1fr .8fr .55fr;gap:5px}.loading-bars i{height:3px;border-radius:2px;background:#7eb18a;transform-origin:left;animation:loadbar 1s ease-in-out infinite}.loading-bars i:nth-child(2){animation-delay:.12s}.loading-bars i:nth-child(3){animation-delay:.24s}@keyframes loadbar{50%{transform:scaleX(.35);opacity:.35}}.error{color:#f0c2b6}.hidden{display:none!important}
    @media(max-width:760px){.top{height:59px;padding:0 14px}.brand span,.top-divider,.dataset,.back{display:none}.brand b{font-size:19px}.view-name{margin-left:auto;font-size:14px}.toolbox{left:12px;top:71px;width:calc(100vw - 24px)}.filter-area,.gap-area{display:none}.inspector{right:12px;top:auto;bottom:12px;width:calc(100vw - 24px);max-height:44vh;padding:14px;transform:translateY(calc(100% + 24px))}.inspector.show{transform:translateY(0)}.guide{left:12px;bottom:12px;padding:8px 10px;font-size:10px;transition:opacity .14s ease}.guide span{display:none}.note-open .guide{opacity:0}.hint{display:none}.controls{right:12px;bottom:12px}.note-open .controls{bottom:calc(44vh + 24px)}.control{width:38px;height:38px;border-radius:12px}.search-results{max-height:210px}.panel,.top,.guide{backdrop-filter:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="graph" aria-label="可操作的教务知识图谱"></div>
  <div class="app">
    <header class="top">
      <a class="brand" href="/" aria-label="返回西北大学教务问答">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M5 17.6V27c3.2 2.1 6.7 3 12 3s8.8-.9 12-3v-9.4" stroke="#b9d6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17.6 20 9l15 8.6L20 26 5 17.6Z" fill="#b9d6ff"/><path d="M32.5 15.6v8.7" stroke="#e6f0ff" stroke-width="2.2" stroke-linecap="round"/></svg>
        <b>西北大学</b><span>教务知识问答系统</span>
      </a>
      <i class="top-divider"></i><div class="view-name">知识图谱</div>
      <div class="dataset"><i></i><b id="stat">载入中</b><span>教务资料与条目关联</span></div>
      <a class="back" href="/nwu/knowledge-galaxy">知识星系</a>
      <a class="back" href="/">返回知识维护</a>
    </header>

    <section class="toolbox">
      <div class="panel search-row">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.1" stroke="currentColor" stroke-width="1.8"/><path d="m15.6 15.6 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="搜索政策、指南、通知或常见问题">
        </label>
        <div class="search-results" id="results" role="listbox"></div>
      </div>
      <div class="panel filter-area">
        <div class="filter-title"><span>显示节点</span><button type="button" id="show-all">全部显示</button></div>
        <div class="filters" id="filters"></div>
      </div>
      <div class="panel gap-area" id="gap-area" hidden>
        <div class="filter-title"><span>待补充问题</span><span class="gap-count" id="gap-count"></span></div>
        <ol class="gap-list" id="gap-list"></ol>
        <div class="gap-tip">这些是教务问答暂未覆盖的问题。在「知识维护」对话里发送“查看知识缺口”，补充资料并发布后即可逐条销掉。</div>
      </div>
    </section>

    <aside class="panel inspector" id="inspector" aria-live="polite">
      <button class="close" id="detail-close" type="button" aria-label="关闭详情">×</button>
      <button class="focus-node" id="detail-focus" type="button" aria-label="定位到当前节点">定位</button>
      <div class="eyebrow"><i id="detail-dot"></i><span id="detail-kind"></span></div>
      <h2 id="detail-title"></h2>
      <div class="node-meta" id="detail-meta"></div>
      <p class="node-summary" id="detail-summary"></p>
      <article class="note-content" id="note-content"></article>
      <div class="relation-title" id="relation-title"></div>
      <div class="relations" id="relations"></div>
    </aside>

    <div class="guide"><kbd>单击</kbd><span>阅读</span><kbd>双击</kbd><span>定位</span><kbd>拖动</kbd><span>平移或调整节点</span></div>
    <div class="hint" id="hint"><strong>图谱已就绪</strong>，先试着点一个节点。</div>
    <div class="controls">
      <button class="control" id="zoom-in" type="button" title="放大" aria-label="放大">+</button>
      <button class="control" id="zoom-out" type="button" title="缩小" aria-label="缩小">−</button>
      <button class="control reset" id="fit" type="button" title="查看全图" aria-label="查看全图">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="control reset" id="relayout" type="button" title="重新布局" aria-label="重新布局">↻</button>
    </div>
    <div class="loading" id="loading"><span>正在整理资料之间的联系</span><div class="loading-bars" aria-hidden="true"><i></i><i></i><i></i></div></div>
  </div>

  <script src="/nwu/assets/force-graph.min.js"></script>
  <script>
    (() => {
      const palette = {
        '资料夹': '#2d6b49', '资料': '#c99543', '草稿': '#bd617f', '索引': '#b47491',
        '政策文件': '#d2604f', '办事指南': '#3b86c6', '常见问题': '#2aa382',
        '通知公告': '#e09a35', '名词解释': '#6d6de0',
      }
      const graphContainer = document.querySelector('#graph')
      const loading = document.querySelector('#loading')
      const hint = document.querySelector('#hint')
      const stat = document.querySelector('#stat')
      const search = document.querySelector('#search')
      const results = document.querySelector('#results')
      const filters = document.querySelector('#filters')
      const inspector = document.querySelector('#inspector')
      const noteContent = document.querySelector('#note-content')
      const byId = new Map()
      const byTitle = new Map()
      const neighbors = new Map()
      const degree = new Map()
      const detailCache = new Map()
      let nodes = []
      let links = []
      let activeKinds = new Set()
      let selected = null
      let hovered = null
      let detailRequest = null
      let initialFitFrame = 0
      let redrawFrame = 0
      let nodePointer = null
      let backgroundPointer = null
      let lastNodeClick = null

      if (!window.ForceGraph) {
        loading.innerHTML = '<span class="error">图谱组件加载失败，请检查网络后刷新页面。</span>'
        return
      }

      const idOf = value => typeof value === 'object' && value ? value.id : value
      const color = kind => palette[kind] || '#8aa897'
      const safeZoom = () => {
        const value = graph.zoom()
        return Number.isFinite(value) && value > 0 ? value : 1
      }
      function requestGraphRedraw() {
        if (redrawFrame) return
        redrawFrame = window.requestAnimationFrame(() => {
          redrawFrame = 0
          graph.zoom(safeZoom())
        })
      }
      const getNeighbors = node => neighbors.get(node.id) || new Set()
      const isVisible = node => activeKinds.has(node.kind)
      const currentFocus = () => selected || hovered
      const nodeRadius = node => {
        const count = degree.get(node.id) || 0
        if (node.kind === '资料夹') return 17
        if (node.kind === '草稿') return 10
        if (node.kind === '资料') return Math.min(11, 7 + Math.sqrt(count) * .7)
        return Math.min(14, 7 + Math.sqrt(count) * 1.2)
      }
      const isFocused = node => {
        const focus = currentFocus()
        return !focus || node.id === focus.id || getNeighbors(focus).has(node.id)
      }
      const isFocusedLink = link => {
        const focus = currentFocus()
        if (!focus) return false
        return idOf(link.source) === focus.id || idOf(link.target) === focus.id
      }
      const labelKindPriority = {
        '资料夹': 900, '索引': 860, '资料': 80, '草稿': 60,
        '政策文件': 830, '办事指南': 780, '通知公告': 700, '常见问题': 560, '名词解释': 420,
      }
      function labelLines(value, maxChars) {
        const chars = Array.from(String(value || ''))
        if (chars.length <= maxChars) return [chars.join('')]
        const visible = chars.slice(0, maxChars * 2)
        const truncated = chars.length > visible.length
        const split = Math.ceil(visible.length / 2)
        const second = visible.slice(split)
        if (truncated) second.splice(Math.max(0, second.length - 1), 1, '…')
        return [visible.slice(0, split).join(''), second.join('')]
      }
      function shouldDrawLabel(node, globalScale, focus) {
        if (node === selected || node === hovered) return true
        if (focus) return getNeighbors(focus).has(node.id)
        const count = degree.get(node.id) || 0
        const major = node.kind === '资料夹' || node.kind === '索引'
          || node.kind === '政策文件' || node.kind === '办事指南' || node.kind === '常见问题'
          || node.kind === '通知公告' || node.kind === '名词解释'
        if (globalScale < .72) return major || count >= 34
        if (globalScale < 1.05) return major || count >= 24
        if (globalScale < 1.55) return major || count >= 16
        if (globalScale < 2.3) return major || count >= 10
        return true
      }
      function labelPriority(node, focus) {
        let priority = labelKindPriority[node.kind] || 0
        priority += Math.min(120, degree.get(node.id) || 0) * 8
        if (focus && getNeighbors(focus).has(node.id)) priority += 2600
        if (node === hovered) priority += 8000
        if (node === selected) priority += 12000
        return priority
      }
      function overlapsLabel(left, right) {
        return left.x < right.x + right.width && left.x + left.width > right.x
          && left.y < right.y + right.height && left.y + left.height > right.y
      }
      function roundRectPath(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2)
        context.beginPath()
        context.moveTo(x + r, y)
        context.arcTo(x + width, y, x + width, y + height, r)
        context.arcTo(x + width, y + height, x, y + height, r)
        context.arcTo(x, y + height, x, y, r)
        context.arcTo(x, y, x + width, y, r)
        context.closePath()
      }
      function drawGraphLabels(context, globalScale) {
        if (!Number.isFinite(globalScale) || globalScale <= 0) return
        const focus = currentFocus()
        const occupied = []
        const candidates = nodes
          .filter(node => isVisible(node) && Number.isFinite(node.x) && Number.isFinite(node.y) && shouldDrawLabel(node, globalScale, focus))
          .sort((left, right) => labelPriority(right, focus) - labelPriority(left, focus))

            const centerX = visibleNodes.length % 2 ? xs[middle] : (xs[middle - 1] + xs[middle]) / 2
            const centerY = visibleNodes.length % 2 ? ys[middle] : (ys[middle - 1] + ys[middle]) / 2
            graph.centerAt(centerX, centerY, 0)
          }
          window.setTimeout(() => hint.classList.add('fade'), 5200)
        })
      }
      async function load() {
        loading.classList.remove('hidden')
        try {
          const response = await fetch('/nwu/api/evolution/graph', { cache: 'no-store' })
          if (!response.ok) throw new Error('接口返回 ' + response.status)
          const payload = await response.json()
          nodes = (payload.nodes || []).map(node => ({ ...node, id: String(node.id), title: String(node.title || '未命名知识') }))
          links = (payload.links || []).map(link => ({ ...link, source: String(link.source), target: String(link.target) }))
          byId.clear()
          byTitle.clear()
          neighbors.clear()
          degree.clear()
          for (const node of nodes) {
            byId.set(node.id, node)
            if (!byTitle.has(node.title)) byTitle.set(node.title, node)
            neighbors.set(node.id, new Set())
            degree.set(node.id, 0)
          }
          for (const link of links) {
            if (!byId.has(link.source) || !byId.has(link.target)) continue
            neighbors.get(link.source).add(link.target)
            neighbors.get(link.target).add(link.source)
            degree.set(link.source, (degree.get(link.source) || 0) + 1)
            degree.set(link.target, (degree.get(link.target) || 0) + 1)
          }
          activeKinds = new Set(nodes.map(node => node.kind))
          cancelDetailRequest()
          detailCache.clear()
          selected = null
          hovered = null
          renderFilters()
          const stats = payload.stats || {}
          stat.textContent = (stats.graphNodes || nodes.length) + ' 个节点 · ' + (stats.graphLinks || links.length) + ' 条关联'
          graph.graphData({ nodes, links })
          graph.d3ReheatSimulation()
          scheduleInitialFit()
          const focusId = new URLSearchParams(location.search).get('focus')
          if (focusId) {
            const target = byId.get(focusId) || byTitle.get(focusId)
            if (target) window.setTimeout(() => selectNode(target, true), 900)
          }
        } catch (error) {
          loading.innerHTML = '<span class="error">知识图谱加载失败：' + String(error.message || error) + '</span>'
          return
        }
        loading.classList.add('hidden')
      }

      async function loadGaps() {
        const area = document.querySelector('#gap-area')
        try {
          const response = await fetch('/nwu/api/evolution/gaps?status=open', { cache: 'no-store' })
          if (!response.ok) return
          const payload = await response.json()
          const list = document.querySelector('#gap-list')
          list.replaceChildren()
          if (!payload.gaps.length) {
            area.hidden = true
            return
          }
          document.querySelector('#gap-count').textContent = payload.count + ' 条待补'
          for (const gap of payload.gaps.slice(0, 30)) {
            const item = document.createElement('li')
            item.className = 'gap-item'
            item.title = '首次提问 ' + String(gap.firstReportedAt || '').slice(0, 10)
              + (gap.notes && gap.notes.length ? '\n线索：' + gap.notes.join('；') : '')
            const badge = document.createElement('i')
            badge.textContent = '×' + gap.count
            const question = document.createElement('span')
            question.textContent = gap.question
            item.append(badge, question)
            list.append(item)
          }
          area.hidden = false
        } catch {
          area.hidden = true
        }
      }

      search.addEventListener('input', showResults)
      search.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          const first = results.querySelector('.search-result')
          if (first) first.click()
        }
        if (event.key === 'Escape') {
          search.value = ''
          showResults()
          search.blur()
        }
      })
      document.querySelector('#show-all').addEventListener('click', () => {
        activeKinds = new Set(nodes.map(node => node.kind))
        renderFilters()
        requestGraphRedraw()
      })
      document.querySelector('#zoom-in').addEventListener('click', () => graph.zoom(safeZoom() * 1.24))
      document.querySelector('#zoom-out').addEventListener('click', () => graph.zoom(safeZoom() / 1.24))
      document.querySelector('#fit').addEventListener('click', () => graph.zoomToFit(0, 96, isVisible))
      document.querySelector('#relayout').addEventListener('click', clearFixedPositions)
      document.querySelector('#detail-focus').addEventListener('click', () => focusNode(selected))
      document.querySelector('#detail-close').addEventListener('click', clearSelection)
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && document.activeElement !== search) clearSelection()
      })
      let resizeFrame = 0
      window.addEventListener('resize', () => {
        window.cancelAnimationFrame(resizeFrame)
        resizeFrame = window.requestAnimationFrame(() => graph.width(window.innerWidth).height(window.innerHeight))
      })
      load()
      loadGaps()
    })()
  </script>
</body>
</html>
